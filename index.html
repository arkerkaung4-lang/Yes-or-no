<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ပြန်ချစ်ပါ့မလားဟင်? ❤️</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ffeef2;
            font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
            transition: background-color 0.5s ease;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            width: 320px;
            position: relative;
            animation: fadeIn 0.5s ease;
            z-index: 10;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.6rem;
            margin: 20px 0 10px 0;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 50px;
            align-items: center;
            margin-top: 15px;
            position: relative;
        }

        button {
            padding: 10px 25px;
            font-size: 1.1rem;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            min-width: 90px;
            height: 45px;
            transition: transform 0.1s;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
            z-index: 10;
        }

        #yesBtn:active {
            transform: scale(0.95);
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
            position: absolute;
            z-index: 100;
            transition: left 0.15s ease, top 0.15s ease;
        }

        .hidden { display: none !important; }
        
        .main-sticker { 
            width: 170px; 
            height: 170px;
            object-fit: contain;
        }

        .success-sticker { 
            width: 180px; 
            height: 180px;
            object-fit: contain;
        }
        
        .sub-text {
            color: #ff4d6d;
            font-size: 0.95rem;
            font-weight: bold;
            margin-top: 15px;
            line-height: 1.8;
        }

        .heart {
            position: fixed;
            font-size: 24px;
            animation: floatUp 3s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.5);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="card" id="quizCard">
        <!-- ပထမ Sticker -->
        <img class="main-sticker" src="https://media.giphy.com/media/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute Sticker">
        <h1>ပြန်ချစ်ပါ့မလားဟင်?</h1>
        <div class="btn-container">
            <button id="yesBtn">Yes</button>
            <button id="noBtn" style="left: 170px;">No</button>
        </div>
    </div>

    <div class="card hidden" id="successCard">
        <!-- ဒုတိယ Sticker (အသစ်လဲပေးထားသော Link) -->
        <img class="success-sticker" src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" alt="Cute Kissing Cat">
        <h1 style="margin-bottom: 5px;">သိသားပဲ! ❤️</h1>
        <div class="sub-text">
            ☁️ ပြန်ချစ်တာကောဆိုပါဘူး စောက်ချောကြီးကို☁️<br>
            ✨ အများကြီးချစ်ရတယ်နော် ✨
        </div>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const quizCard = document.getElementById('quizCard');
        const successCard = document.getElementById('successCard');

        function moveButton(e) {
            if (e) e.preventDefault();
            
            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;
            
            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton, { passive: false });
        noBtn.addEventListener('click', moveButton);

        yesBtn.addEventListener('click', () => {
            quizCard.classList.add('hidden');
            successCard.classList.remove('hidden');
            document.body.style.backgroundColor = "#ffc1cc";
            createHearts();
        });

        function createHearts() {
            for (let i = 0; i < 25; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.classList.add('heart');
                    heart.innerHTML = '❤️';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.body.appendChild(heart);

                    setTimeout(() => {
                        heart.remove();
                    }, 4000);
                }, i * 150);
            }
        }
    </script>

</body>
</html>
